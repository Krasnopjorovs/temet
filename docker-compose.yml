services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: astro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: astro
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astro -d astro"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://astro:${POSTGRES_PASSWORD}@db:5432/astro
      DOCTRINE: classic_modern_v1
      ENABLE_NETWORK: ${ENABLE_NETWORK:-0}   # 1 — включить профили и поиск совпадений (хранят данные рождения)
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8095}:8000"   # по умолчанию loopback; API_BIND=<LAN IP> — доступ из LAN
    restart: unless-stopped

volumes:
  pgdata:
